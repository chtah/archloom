name: Feature request
description: Propose a change to the graph format, CLI, library, canvas or agent skill.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Archloom draws architecture and data flow from a JSON graph, locally. A backend, graph upload, a model provider and pull-request integrations are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to show or do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you have in mind. For a graph field or CLI option, show an example.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds
      description: What you do instead today, if anything.
    validations:
      required: false
