version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]

  # Actions are pinned to commit SHAs, so they only move through these PRs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
