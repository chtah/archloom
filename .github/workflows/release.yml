name: Release

# The only workflow that publishes. It runs when a v* tag is pushed and waits for
# the owner's approval in the "npm" environment before it does anything.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC); there is no npm token
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag against main and package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$TAG is not a commit on main"; exit 1; }
          version="$(node -p "require('./package.json').version")"
          [ "$TAG" = "v$version" ] \
            || { echo "::error::tag $TAG does not match package.json version $version"; exit 1; }
          grep -q "^## $version\$" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer; fail early rather than at publish.
      - name: Check the npm version
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)" \
            || { echo "::error::npm 11.5.1 or newer is required for trusted publishing"; exit 1; }

      # The hosted Ubuntu image includes Chrome. Do not download another browser.
      - name: Locate runner Chrome
        run: |
          chrome_bin="$(command -v google-chrome || command -v google-chrome-stable)"
          "$chrome_bin" --version
          printf 'CHROME_BIN=%s\n' "$chrome_bin" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, typecheck and test including real Chrome
        run: pnpm verify

      - name: Test packed installation and optional peers
        run: pnpm test:package

      - name: Pack the checked build
        run: |
          mkdir -p .archloom/release
          npm pack . --ignore-scripts --pack-destination .archloom/release
          sha512sum .archloom/release/*.tgz

      - name: Publish with provenance
        run: npm publish .archloom/release/*.tgz --ignore-scripts --access public

  github-release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write # create the release for the tag; nothing else
    steps:
      # "npm publish" can return before the version is installable: the registry
      # takes minutes to serve a new tarball, and a staged version waits for the
      # owner to confirm it on npmjs.com. Announce nothing until it can be installed.
      - name: Wait for the registry to serve the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          for attempt in $(seq 1 90); do
            listed="$(curl -fsS "https://registry.npmjs.org/@chtah%2farchloom" | jq -r --arg v "$version" '.versions[$v].dist.tarball // empty' || true)"
            if [ -n "$listed" ] && curl -fsS -o /dev/null "$listed"; then
              echo "@chtah/archloom@$version is installable"
              exit 0
            fi
            echo "attempt $attempt: not served yet"
            sleep 20
          done
          echo "::error::@chtah/archloom@$version is not on the registry after 30 minutes. If it is staged, confirm it on npmjs.com, then re-run this job only."
          exit 1

      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          {
            printf 'Published to npm as [`@chtah/archloom@%s`](https://www.npmjs.com/package/@chtah/archloom/v/%s).\n\n' "$version" "$version"
            awk -v v="$version" '$0 == "## " v { on = 1; next } on && /^## / { exit } on' CHANGELOG.md
          } > notes.md
          gh release create "$TAG" --verify-tag --title "Archloom $version" --notes-file notes.md
