name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify library, CLI and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The hosted Ubuntu image includes Chrome. Do not download another browser.
      - name: Locate runner Chrome
        run: |
          chrome_bin="$(command -v google-chrome || command -v google-chrome-stable)"
          "$chrome_bin" --version
          printf 'CHROME_BIN=%s\n' "$chrome_bin" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, typecheck and test including real Chrome
        run: pnpm verify

      - name: Test packed installation and optional peers
        run: pnpm test:package
